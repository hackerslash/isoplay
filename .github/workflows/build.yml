name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pipx run ruff==0.17.4 check .

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install meson ninja jinja2
      - name: macOS mpv dependencies
        if: runner.os == 'macOS'
        run: brew install pkgconf ffmpeg libplacebo libass libdvdnav libbluray ant
      - name: Linux mpv dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config ant libxcb-cursor0 \
            libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev \
            libavdevice-dev libass-dev libbluray-dev libgl-dev libegl-dev libcurl4-openssl-dev
          # mpv 0.42 needs libplacebo >= 7.387; Ubuntu 24.04 ships 6.338
          git clone --depth 1 --branch v7.387.0 --recurse-submodules https://code.videolan.org/videolan/libplacebo.git /tmp/libplacebo
          meson setup /tmp/libplacebo/build /tmp/libplacebo --buildtype=release --prefix=/usr/local \
            -Dvulkan=disabled -Ddemos=false -Dtests=false
          sudo "$(which ninja)" -C /tmp/libplacebo/build install
          # Ubuntu's libdvdread 6.1 ignores stream callbacks without libdvdcss, so remote DVDs can't open
          for lib in libdvdread/7.0.1/libdvdread-7.0.1 libdvdnav/7.0.0/libdvdnav-7.0.0; do
            curl -sfL "https://download.videolan.org/pub/videolan/$lib.tar.xz" | tar xJ -C /tmp
            src="/tmp/$(basename "$lib")"
            meson setup "$src/build" "$src" --buildtype=release --prefix=/usr/local
            sudo "$(which ninja)" -C "$src/build" install
            sudo ldconfig
          done
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-libplacebo mingw-w64-ucrt-x86_64-libass mingw-w64-ucrt-x86_64-libdvdnav
            mingw-w64-ucrt-x86_64-libbluray mingw-w64-ucrt-x86_64-curl
      - name: Windows toolchain on PATH
        if: runner.os == 'Windows'
        run: |
          choco install ant --no-progress -y
          "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" >> $env:GITHUB_PATH
          # MSYS2 pulls in its own Python; keep setup-python's ahead of it (later lines win)
          "$env:pythonLocation\Scripts" >> $env:GITHUB_PATH
          "$env:pythonLocation" >> $env:GITHUB_PATH
      - run: pip install -r requirements-build.txt
      - run: python -m unittest -v tests.test_updates tests.test_update_ui
      - run: python -m unittest -v tests.test_disc_image
        if: runner.os == 'Linux'
      - run: python -m tests.test_isoplay
        if: runner.os == 'Linux'
      - run: python build.py
      - run: python -m unittest -v tests.test_welcome tests.test_player tests.test_engine tests.test_playback tests.test_diskcache
      - run: python -m tests.test_update_bundle
      - uses: actions/upload-artifact@v4
        with:
          name: isoplay-${{ runner.os }}
          path: dist/isoplay-*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/isoplay-*
